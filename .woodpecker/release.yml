when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -B clean package -Dmaven.test.skip

  - name: release
    image: alpine:latest
    commands:
      - apk add --no-cache gh
      - gh release create "${CI_COMMIT_TAG}" target/execlauncher.jar
        --repo "${CI_REPO_OWNER}/${CI_REPO_NAME}"
        --title "${CI_COMMIT_TAG}"
        --generate-notes
    environment:
      GH_TOKEN:
        from_secret: github_token