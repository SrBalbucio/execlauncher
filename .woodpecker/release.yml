when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -B clean package -Dmaven.test.skip

  - name: github-release
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api_key:
        from_secret: github_access_token
      files:
        - target/execlauncher.jar
      checksum: sha256
      checksum-flatten: true
      title: ${CI_COMMIT_TAG}
      draft: false
      file_exists: overwrite
      overwrite: true